<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Emergency Safety Mode - Surat</title>
  
  <!-- Ashish's Note: Load common and Leaflet styles -->
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  
  <!-- Ashish's Note: Specific styles for the two-column layout and safety buttons -->
  <style>
    body {
      display: flex;
      flex-direction: column;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden; /* Prevents full-page scroll */
    }

    header {
      flex-shrink: 0; /* Header should not shrink */
    }

    main {
      display: flex;
      flex: 1; /* Main content takes remaining height */
      overflow: hidden; /* Prevents main from overflowing */
    }

    .sidebar {
      width: 320px; /* Fixed width sidebar */
      padding: 1.5rem;
      background-color: #ffffff;
      border-right: 1px solid #e5e7eb;
      overflow-y: auto; /* Allow sidebar to scroll */
      z-index: 10;
      flex-shrink: 0;
    }
    
    .sidebar h2 {
        margin-top: 0;
    }

    #map {
      flex: 1; /* Map takes remaining width */
      height: 100%;
    }
    
    /* Ashish's Note: Styling for the safety feature buttons */
    .safety-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 1.5rem;
    }
    
    .safety-controls button {
        padding: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        border: 2px solid transparent;
        border-radius: 8px;
        background-color: #f0f0f0;
        transition: background-color 0.2s, border-color 0.2s;
    }
    
    .safety-controls button:hover {
        background-color: #e0e0e0;
    }
    
    /* Ashish's Note: Specific colors for emergency buttons */
    #findPolice { background-color: #cce5ff; color: #004085; border-color: #b8daff;}
    #findHospital { background-color: #d4edda; color: #155724; border-color: #c3e6cb;}
    #findPharmacy { grid-column: 1 / -1; background-color: #d1ecf1; color: #0c5460; border-color: #bee5eb;}
    
    /* Ashish's Note: Special styling for the toggle button */
    #toggleSafetyZones {
        grid-column: 1 / -1;
        margin-top: 10px;
        background-color: #f8d7da;
        color: #721c24;
        border-color: #f5c6cb;
    }
    
    #toggleSafetyZones.active {
        /* Ashish's Note: Style when zones are ON */
        background-color: #721c24;
        color: white;
    }
    
    #safety-status {
        margin-top: 1.5rem;
        font-weight: 600;
        color: #555;
        padding-top: 1rem;
        border-top: 1px solid #e5e7eb;
    }

    /* Ashish's Note: Responsive behavior for mobile view */
    @media (max-width: 768px) {
      main {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: 50vh; /* Sidebar takes top 50% */
        border-right: none;
        border-bottom: 1px solid #ccc;
      }
      #map {
        height: 50vh; /* Map takes bottom 50% */
      }
    }
  </style>
</head>
<body>
  <header>
    <!-- 
      Ashish's Note: Using a safety icon (police) for this page.
      Make sure you have this icon at 'assets/icons/police.svg'.
      If not, change it back to 'AI route logo.png'.
    -->
    <img src="../assets/icons/police.svg" alt="Safety Logo" class="logo"/>
    <h1>Emergency Safety Mode</h1>
  </header>
  
  <main>
    <!-- Left-hand Sidebar for the controls -->
    <div class="sidebar">
        <h2>Safety Controls</h2>
        <p style="font-size: 0.9rem; color: #555;">Find the nearest emergency services or view high-risk zones in Surat.</p>
        
        <!-- Ashish's Note: These are the buttons js/safety.js controls -->
        <div class="safety-controls">
            <button id="findPolice">Find Police</button>
            <button id="findHospital">Find Hospital</button>
            <button id="findPharmacy">Find Pharmacy</button>
            <button id="toggleSafetyZones">Show High-Risk Zones</button>
        </div>
        
        <!-- Ashish's Note: This div will show status messages -->
        <div id="safety-status">
            Initializing map...
        </div>
    </div>

    <!-- Right-hand Map Container -->
    <div id="map"></div>
  </main>
  
  <footer>
    <a href="../index.html">⟵ Back Home</a>
  </footer>
  
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  
  <!-- 
    Ashish's Note: Script loading order is CRITICAL.
    1. Load config.js (so the API key is globally available).
    2. Load safety.js (which uses the key).
    REMOVED type="module" to prevent import/export errors.
  -->
  <script src="../config.js?v=1.2"></script> 
  <script src="../js/safety.js?v=1.2"></script>
</body>
</html>
